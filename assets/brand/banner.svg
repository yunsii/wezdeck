<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" role="img" aria-label="WezDeck — A flight deck for your AI agents">
  <title>WezDeck</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f16"/>
      <stop offset="1" stop-color="#141b27"/>
    </linearGradient>
    <linearGradient id="deck" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2e3a4d"/>
      <stop offset="1" stop-color="#080c14"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a5870"/>
      <stop offset="1" stop-color="#14192a"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>

  <g transform="translate(32 32) scale(0.5)">
    <rect x="40" y="40" width="432" height="432" rx="76" fill="url(#edge)"/>
    <rect x="56" y="56" width="400" height="400" rx="64" fill="url(#deck)"/>

    <g fill="none" stroke="#2f3a4c" stroke-width="3">
      <rect x="104" y="104" width="96" height="96" rx="18"/>
      <rect x="208" y="104" width="96" height="96" rx="18"/>
      <rect x="312" y="104" width="96" height="96" rx="18"/>
      <rect x="104" y="208" width="96" height="96" rx="18"/>
      <rect x="208" y="208" width="96" height="96" rx="18"/>
      <rect x="312" y="208" width="96" height="96" rx="18"/>
      <rect x="104" y="312" width="96" height="96" rx="18"/>
      <rect x="208" y="312" width="96" height="96" rx="18"/>
      <rect x="312" y="312" width="96" height="96" rx="18"/>
    </g>

    <g fill="#43536a" opacity="0.55">
      <circle cx="360" cy="152" r="3.5"/>
      <circle cx="256" cy="152" r="3.5"/>
      <circle cx="152" cy="256" r="3.5"/>
      <circle cx="360" cy="256" r="3.5"/>
      <circle cx="152" cy="360" r="3.5"/>
      <circle cx="256" cy="360" r="3.5"/>
    </g>

    <!-- running ● -->
    <g>
      <circle cx="152" cy="152" r="40" fill="#38bdf8" opacity="0.18" filter="url(#soft)"/>
      <rect x="116" y="116" width="72" height="72" rx="14" fill="#38bdf8" opacity="0.14" stroke="#38bdf8" stroke-opacity="0.55" stroke-width="2"/>
      <circle cx="152" cy="152" r="14" fill="#38bdf8"/>
    </g>

    <!-- waiting ▲ -->
    <g>
      <circle cx="256" cy="256" r="40" fill="#fbbf24" opacity="0.20" filter="url(#soft)"/>
      <rect x="220" y="220" width="72" height="72" rx="14" fill="#fbbf24" opacity="0.14" stroke="#fbbf24" stroke-opacity="0.55" stroke-width="2"/>
      <path d="M 256 238 L 276 274 L 236 274 Z" fill="#fbbf24"/>
    </g>

    <!-- done ✓ -->
    <g>
      <circle cx="360" cy="360" r="40" fill="#4ade80" opacity="0.20" filter="url(#soft)"/>
      <rect x="324" y="324" width="72" height="72" rx="14" fill="#4ade80" opacity="0.14" stroke="#4ade80" stroke-opacity="0.55" stroke-width="2"/>
      <path d="M 335 362 L 353 380 L 385 345" fill="none" stroke="#4ade80" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <g transform="translate(340 0)">
    <text x="0" y="150" font-size="100" font-weight="500" fill="#e6edf6" letter-spacing="-3.5"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">WezDeck</text>
    <text x="3" y="188" font-size="19" fill="#9fb0c8" letter-spacing="0.3"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">A flight deck for your AI agents</text>

    <!-- status row: order + glyphs match right-status (▲ waiting · ✓ done · ● running);
         ▲/● optical centers at y≈-8 with the 22px number baseline -->
    <g transform="translate(3 244)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">
      <!-- waiting ▲ -->
      <g>
        <path d="M 13 -17 L 23 -1 L 3 -1 Z" fill="#fbbf24"/>
        <text x="38" y="0" font-size="22" font-weight="400" fill="#e6edf6">1</text>
        <text x="60" y="-2" font-size="15" fill="#9fb0c8" letter-spacing="0.5">waiting</text>
      </g>
      <!-- done ✓ -->
      <g transform="translate(190 0)">
        <g transform="translate(13 -10)" fill="none" stroke="#4ade80" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M -8 1 L 0 9 L 12 -7"/>
        </g>
        <text x="38" y="0" font-size="22" font-weight="400" fill="#e6edf6">7</text>
        <text x="60" y="-2" font-size="15" fill="#9fb0c8" letter-spacing="0.5">done</text>
      </g>
      <!-- running ● -->
      <g transform="translate(380 0)">
        <circle cx="13" cy="-8" r="7" fill="#38bdf8"/>
        <text x="38" y="0" font-size="22" font-weight="400" fill="#e6edf6">3</text>
        <text x="60" y="-2" font-size="15" fill="#9fb0c8" letter-spacing="0.5">running</text>
      </g>
    </g>

    <text x="3" y="288" font-size="13" fill="#5f6e85" letter-spacing="1.4"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">WEZTERM · TMUX · GIT WORKTREES</text>
  </g>
</svg>
