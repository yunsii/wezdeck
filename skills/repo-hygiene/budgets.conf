# Line budgets for repo-hygiene (soft = audit warn, hard = new-file / newly-crossing fail).
# Format:
#   pattern soft hard
#   allow path   # grandfather / explicit exception (still reported in audit)
#
# First matching pattern wins. Patterns are matched against repo-relative paths.

# Design stance (keyboard / headless-verify / observability) is entrypoint doctrine;
# soft 150 still warns; hard raised so the stance block is not a false fail.
AGENTS.md 150 240
CLAUDE.md 150 240
docs/presentations/* 500 800
docs/* 400 600
openclaw/README.md 300 500
openclaw/workspace/AGENTS.md 150 250
openclaw/docs/* 400 600
*.lua 800 1200
scripts/**/*.sh 600 900
*.sh 600 900

