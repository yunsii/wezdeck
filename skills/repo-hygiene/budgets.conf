# Line budgets for repo-hygiene (soft = audit warn, hard = new-file / newly-crossing fail).
# Format:
#   pattern soft hard
#   allow path   # a label for known debt over hard (audit tags it); it does not
#                # exempt: any file already over hard may only shrink
#
# First matching pattern wins. Patterns are matched against repo-relative paths.

# Design stance (keyboard / headless-verify / observability) is entrypoint doctrine;
# soft 150 still warns; hard raised so the stance block is not a false fail.
AGENTS.md 150 240
CLAUDE.md 150 240
docs/presentations/* 500 800
docs/* 400 600
openclaw/README.md 300 500
openclaw/workspace/AGENTS.md 150 250
openclaw/docs/* 400 600
*.lua 800 1200
*.cs 500 800
# Go / Python had no budget (only docs, Lua, C#, shell; web JS/TS is held by
# ESLint max-lines): added 2026-11-24. Tests get more room; first match wins.
*_test.go 800 1200
*.go 600 900
*.py 600 900
scripts/**/*.sh 600 900
*.sh 600 900

# Known debt over hard — listed by audit; pre-commit fails the moment such a
# file grows (listed or not), and any new file or new crossing above hard.
